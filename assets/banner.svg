<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#09152b" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="drop-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 46px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #38bdf8; letter-spacing: 1.5px; }

    /* Animated background elements */
    .pulse-heartbeat {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dash 3s linear infinite;
    }

    .float-node {
      animation: float 6s ease-in-out infinite alternate;
    }

    .float-node-delayed {
      animation: float 6s ease-in-out infinite alternate;
      animation-delay: -3s;
    }

    .orbit-particle {
      animation: orbit 12s linear infinite;
      transform-origin: 980px 180px;
    }

    @keyframes dash {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }

    @keyframes orbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Dark Rich Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.07">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" stroke="#ffffff" stroke-width="1" />
    <path d="M 120 0 L 120 360 M 240 0 L 240 360 M 360 0 L 360 360 M 480 0 L 480 360 M 600 0 L 600 360 M 720 0 L 720 360 M 840 0 L 840 360 M 960 0 L 960 360 M 1080 0 L 1080 360" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- DYNAMIC BACKGROUND GRAPHICS -->

  <!-- ECG / Heartbeat Line in Background -->
  <g opacity="0.25">
    <path d="M 50 290 L 300 290 L 320 270 L 335 315 L 355 230 L 375 330 L 395 280 L 410 290 L 1150 290" fill="none" stroke="#06b6d4" stroke-width="3" />
    <path class="pulse-heartbeat" d="M 50 290 L 300 290 L 320 270 L 335 315 L 355 230 L 375 330 L 395 280 L 410 290 L 1150 290" fill="none" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" />
  </g>

  <!-- Healthcare Data Interoperability Network Graphic -->
  <g transform="translate(900, 180)">
    <circle r="120" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6" />
    <circle r="85" fill="none" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1.5" />
    <circle r="50" fill="url(#accent-cyan)" opacity="0.15" filter="url(#glow)" />

    <circle r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
    <path d="M -8 -3 L -3 -3 L -3 -8 L 3 -8 L 3 -3 L 8 -3 L 8 3 L 3 3 L 3 8 L -3 8 L -3 3 L -8 3 Z" fill="#38bdf8" />

    <g class="orbit-particle">
      <circle cx="85" cy="0" r="7" fill="#22d3ee" filter="url(#glow)" />
      <circle cx="-85" cy="0" r="5" fill="#6366f1" />
      <circle cx="0" cy="85" r="6" fill="#3b82f6" />
    </g>
  </g>

  <!-- Floating Cards Right Background -->
  <g class="float-node" transform="translate(740, 65)" opacity="0.85" filter="url(#drop-shadow)">
    <rect width="180" height="54" rx="12" fill="url(#card-bg)" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="27" r="12" fill="#0284c7" opacity="0.3" />
    <path d="M 23 27 L 27 31 L 34 23" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="50" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">FHIR R4 / HL7</text>
    <text x="50" y="39" font-family="sans-serif" font-size="10" fill="#94a3b8">Interoperability</text>
  </g>

  <g class="float-node-delayed" transform="translate(980, 240)" opacity="0.85" filter="url(#drop-shadow)">
    <rect width="170" height="54" rx="12" fill="url(#card-bg)" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="27" r="12" fill="#818cf8" opacity="0.3" />
    <path d="M 23 27 L 33 27 M 28 22 L 28 32" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
    <text x="50" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">ONC Certified</text>
    <text x="50" y="39" font-family="sans-serif" font-size="10" fill="#94a3b8">Ambulatory &amp; Hospital</text>
  </g>

  <!-- FOREGROUND CONTENT -->
  <g transform="translate(60, 0)">
    <g transform="translate(0, 52)">
      <rect width="280" height="28" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
      <text x="14" y="19" class="badge-text">🏥 HEALTHCARE IT ECOSYSTEM</text>
    </g>

    <text x="0" y="135" class="title">
      Awesome <tspan fill="url(#primary-glow)">Electronic Health Records</tspan>
    </text>

    <text x="0" y="180" class="subtitle">
      A curated ecosystem of SaaS EHR platforms &amp; open-source clinical software.
    </text>

    <g transform="translate(0, 220)">
      <g transform="translate(0, 0)">
        <rect width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ SaaS Platforms</text>
      </g>
      <g transform="translate(177, 0)">
        <rect width="185" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#4ade80">🔓 Open-Source EHRs</text>
      </g>
      <g transform="translate(374, 0)">
        <rect width="185" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#a78bfa">🔄 FHIR &amp; Interoperability</text>
      </g>
    </g>
  </g>
</svg>
